# cargo-fuzz project. Needs nightly (fuzz/rust-toolchain.toml) and a Unix-like OS,
# so it is excluded from the stable workspace and built only by the Linux fuzz job
# in .github/workflows/ci.yml.
#
#   cargo install cargo-fuzz --version 0.13.2 --locked
#   cargo +nightly-2026-10-01 fuzz run smoke -- -max_total_time=30
#
# One target per parser group (#38). CI runs every target listed by `cargo fuzz list`.
[package]
name = "rescue-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rescue-nds = { path = "../crates/nds" }
rescue-formats = { path = "../crates/formats" }
rescue-data = { path = "../crates/data" }

# Own workspace, so cargo does not treat it as part of the root one.
[workspace]
members = ["."]

[[bin]]
name = "nds_container"
path = "fuzz_targets/nds_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nds_blz"
path = "fuzz_targets/nds_blz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats_compress"
path = "fuzz_targets/formats_compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats_gfx"
path = "fuzz_targets/formats_gfx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats_containers"
path = "fuzz_targets/formats_containers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats_assets"
path = "fuzz_targets/formats_assets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_tables"
path = "fuzz_targets/data_tables.rs"
test = false
doc = false
bench = false
