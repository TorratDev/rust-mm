name: Phase 0 verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SDL_VIDEO_DRIVER: offscreen
  SDL_AUDIO_DRIVER: dummy
  CARGO_TERM_COLOR: always

jobs:
  probes:
    name: V1/V2 probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libjack-dev libsndio-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl-dev libgl-dev \
            libgles-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev

      - name: V1 sdl3 probe (build, then headless run)
        working-directory: verification/sdl3-probe
        run: |
          cargo build
          cargo run

      - name: V2 probe (egui/eframe, insta, proptest)
        working-directory: verification/v2-probe
        run: cargo test

      - name: Report toolchain
        run: rustc --version && cargo --version

  v7:
    name: V7 scripted DeSmuME dumps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libdesmume runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install py-desmume
        run: pip install py-desmume==0.0.9

      - name: V7 repeatability check
        shell: bash
        run: verification/v7-trace/run_v7.sh "$RUNNER_TEMP/v7" python

  v8-tools:
    name: V8 code extractor tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: nds_extract_code.py on synthetic ROMs (BLZ, overlays, autoloads)
        run: python -m unittest discover -s tools/tests -v
